x-gentoo-runtime: &gentoo-runtime
  image: gentoo-update-intelligence/gentoo-runtime:local
  build:
    context: .
    dockerfile: gentoo/Dockerfile
    args:
      GENTOO_BASE_IMAGE: ${GENTOO_BASE_IMAGE:-gentoo-update-intelligence/gentoo-base:local}

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["--config", "/etc/gentoo-update-intelligence/backend.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
      metadata-worker:
        condition: service_healthy
    environment:
      GENTOO_UPDATE_INTELLIGENCE_LISTEN_ADDR: ${GENTOO_UPDATE_INTELLIGENCE_LISTEN_ADDR:-}
      GENTOO_UPDATE_INTELLIGENCE_ANALYSIS_CONCURRENCY_LIMIT: ${GENTOO_UPDATE_INTELLIGENCE_ANALYSIS_CONCURRENCY_LIMIT:-}
      GENTOO_UPDATE_INTELLIGENCE_DATABASE_URL: postgres://guit:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/guit?sslmode=disable
      GENTOO_UPDATE_INTELLIGENCE_REPOSITORY: ${GENTOO_UPDATE_INTELLIGENCE_REPOSITORY:-}
      GENTOO_UPDATE_INTELLIGENCE_SOURCE_URL: ${GENTOO_UPDATE_INTELLIGENCE_SOURCE_URL:-${GENTOO_REPOSITORY_URL:-}}
      GENTOO_UPDATE_INTELLIGENCE_REPOSITORY_PATH: ${GENTOO_UPDATE_INTELLIGENCE_REPOSITORY_PATH:-}
      GENTOO_UPDATE_INTELLIGENCE_COMMIT: ${GENTOO_UPDATE_INTELLIGENCE_COMMIT:-}
      GENTOO_UPDATE_INTELLIGENCE_OVERLAY_PATH: ${GENTOO_UPDATE_INTELLIGENCE_OVERLAY_PATH:-}
      GENTOO_UPDATE_INTELLIGENCE_OVERLAY_CATALOG: ${GENTOO_UPDATE_INTELLIGENCE_OVERLAY_CATALOG:-}
      GENTOO_UPDATE_INTELLIGENCE_METADATA_WORKER_URL: ${GENTOO_UPDATE_INTELLIGENCE_METADATA_WORKER_URL:-}
      GENTOO_UPDATE_INTELLIGENCE_METADATA_PROFILE: ${GENTOO_UPDATE_INTELLIGENCE_METADATA_PROFILE:-}
      GENTOO_UPDATE_INTELLIGENCE_STARTUP_TIMEOUT: ${GENTOO_UPDATE_INTELLIGENCE_STARTUP_TIMEOUT:-}
      GENTOO_UPDATE_INTELLIGENCE_HTTP_READ_HEADER_TIMEOUT: ${GENTOO_UPDATE_INTELLIGENCE_HTTP_READ_HEADER_TIMEOUT:-}
      GENTOO_UPDATE_INTELLIGENCE_HTTP_IDLE_TIMEOUT: ${GENTOO_UPDATE_INTELLIGENCE_HTTP_IDLE_TIMEOUT:-}
      GENTOO_UPDATE_INTELLIGENCE_METADATA_WORKER_TIMEOUT: ${GENTOO_UPDATE_INTELLIGENCE_METADATA_WORKER_TIMEOUT:-}
    volumes:
      - type: bind
        source: ${BACKEND_CONFIG_PATH:-./config/backend.yaml}
        target: /etc/gentoo-update-intelligence/backend.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: gentoo-data
        target: /metadata
        read_only: true
      - overlay-data:/overlays
    networks:
      - default
      - metadata-network

  metadata-worker:
    <<: *gentoo-runtime
    entrypoint: ["/usr/local/bin/metadata-worker"]
    environment:
      METADATA_WORKER_LISTEN_ADDR: :8090
      METADATA_WORKER_CACHE_PATH: /metadata-cache
      METADATA_WORKER_TEMP_PATH: /var/tmp/gentoo-update-intelligence
      METADATA_WORKER_PORTAGE_USER: portage
      METADATA_WORKER_PORTAGE_GROUP: portage
      METADATA_WORKER_GENERATION_LIMIT: ${METADATA_WORKER_GENERATION_LIMIT:-2}
      METADATA_WORKER_PREPARATION_LIMIT: ${METADATA_WORKER_PREPARATION_LIMIT:-2}
    volumes:
      - type: volume
        source: gentoo-data
        target: /metadata
        read_only: true
      - type: volume
        source: overlay-data
        target: /overlays
        read_only: true
      - metadata-cache:/metadata-cache
    networks:
      - metadata-network
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  gentoo:
    <<: *gentoo-runtime
    environment:
      GENTOO_REPOSITORY_URL: ${GENTOO_REPOSITORY_URL:-https://anongit.gentoo.org/git/repo/gentoo.git}
    volumes:
      - gentoo-data:/metadata
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: guit
      POSTGRES_USER: guit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guit -d guit"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  gentoo-data:
  overlay-data:
  metadata-cache:

networks:
  metadata-network:
    internal: true
