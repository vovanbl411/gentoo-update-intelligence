services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GENTOO_UPDATE_INTELLIGENCE_LISTEN_ADDR: 0.0.0.0:8080
      GENTOO_UPDATE_INTELLIGENCE_DATABASE_URL: postgres://guit:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/guit?sslmode=disable
      GENTOO_UPDATE_INTELLIGENCE_REPOSITORY: gentoo
      GENTOO_UPDATE_INTELLIGENCE_SOURCE_URL: ${GENTOO_REPOSITORY_URL:-https://anongit.gentoo.org/git/repo/gentoo.git}
      GENTOO_UPDATE_INTELLIGENCE_REPOSITORY_PATH: /metadata/gentoo.git
      GENTOO_UPDATE_INTELLIGENCE_OVERLAY_PATH: /overlays
      GENTOO_UPDATE_INTELLIGENCE_OVERLAY_CATALOG: ${GENTOO_UPDATE_INTELLIGENCE_OVERLAY_CATALOG:-}
    volumes:
      - type: volume
        source: gentoo-data
        target: /metadata
        read_only: true
      - overlay-data:/overlays

  gentoo:
    build:
      context: .
      dockerfile: gentoo/Dockerfile
    environment:
      GENTOO_REPOSITORY_URL: ${GENTOO_REPOSITORY_URL:-https://anongit.gentoo.org/git/repo/gentoo.git}
    volumes:
      - gentoo-data:/metadata
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: guit
      POSTGRES_USER: guit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guit -d guit"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  gentoo-data:
  overlay-data:
