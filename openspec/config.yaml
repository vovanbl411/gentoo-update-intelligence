schema: spec-driven

context: |
  Gentoo Update Intelligence анализирует предоставленный план обновления Gentoo.
  Backend написан на Go; Gentoo-логика отделена от HTTP и UI.
  Сервис не выполняет обновления системы. Analyzer детерминирован;
  AI не является источником истины и не входит в критический путь решения.
  Выводы сопровождаются evidence и ограничениями доступных данных.
  Прочитай AGENTS.md, docs/openspec.md и относящиеся к задаче контракты docs/.
  docs/architecture.md содержит baseline архитектуры, docs/plan.md — этапы.
  Существующие контракты docs/ сохраняют силу до явного переноса области.
  openspec/specs/ содержит только явно перенесённые или новые области;
  отсутствие области там не означает отсутствие её реализации.
  Пиши пояснения на русском, сохраняя идентификаторы и обязательные
  заголовки OpenSpec (Requirement, Scenario, ADDED/MODIFIED/REMOVED Requirements).
  Не описывай планы как реализованное поведение.

rules:
  proposal:
    - Укажи цель, границы задачи, затронутые контракты и критерии приёмки.
    - При переносе области укажи один основной источник требований и судьбу прежнего контракта.
    - Не добавляй frontend, Redis, Compose или HTTP-генерацию metadata без поручения на соответствующий этап.
  specs:
    - Для новой области добавь содержательный раздел Purpose, чтобы archive не оставил placeholder в итоговой спецификации.
    - Для каждого требования задай проверяемый сценарий; используй SHALL или MUST в тексте требования.
    - Учитывай недоступные данные, evidence и границы поддержки, если они затронуты изменением.
    - Не создавай вторую независимую копию требований существующего контракта.
  design:
    - Сохраняй принятые архитектурные границы; изменения вне согласованной задачи сначала обсуждай.
    - Предпочитай минимальное решение; обоснуй новые зависимости и существенные компромиссы.
  tasks:
    - Каждая задача должна иметь проверяемый результат; учитывай проверки из AGENTS.md.
    - Отмечай задачу выполненной только после фактической проверки; указывай оставшиеся ограничения.
